version: '3'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: samandar
      DB_PASSWORD: samandar
      DB_NAME: restaurant-db

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: samandar
      POSTGRES_PASSWORD: samandar
      POSTGRES_DB: restaurant-db
    ports:
      - "5432:5432"
